query GetTodoLists @auth(level: NO_ACCESS) {
  todoLists {
    id
    title
    description
  }
}


query GetCurrentUser @auth(level: USER) {
  users(where: {
    uid: { eq_expr: "auth.uid" }
  }) {
    id
    uid
    email
    displayName
  }
}


query GetMyLists @auth(level: USER) {
  todoLists(
    where: {
      owner: {
        uid: {
          eq_expr: "auth.uid"
        }
      }
    }
  ) {
    id
    title
    description
  }
}
